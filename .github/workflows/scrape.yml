name: Събиране на обяви

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'Запиши страниците за диагностика'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Събиране
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_HTML: ${{ inputs.debug && '1' || '' }}
        run: node scraper/scrape.mjs
      - name: Запис
        run: |
          git config user.name "stroiradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          [ -d inbox ] && git add inbox || true
          [ -d debug ] && git add -f debug || true
          git diff --cached --quiet || git commit -m "Обяви $(date -u +%F' '%H:%M)"
          git pull --rebase -X ours || true
          git push
