name: Събиране на обяви

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Събиране
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scraper/scrape.mjs
      - name: Запис
        run: |
          git config user.name "stroiradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Обяви $(date -u +%F' '%H:%M)"
          git pull --rebase -X ours || true
          git push
